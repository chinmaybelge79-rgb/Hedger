services:
  # ========================================================
  # Hedger Backend API Web Service on Render
  # ========================================================
  - type: web
    name: hedger-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: hedger-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: hedger-redis
          property: connectionString

databases:
  # ========================================================
  # Managed PostgreSQL for Hedger Telemetry & User Models
  # ========================================================
  - name: hedger-postgres
    plan: free
    databaseName: hedger
    user: hedger_user
